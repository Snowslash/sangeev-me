name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check project-page template tooling
        run: python3 -B -m unittest discover -s project-pages/tests
      - name: Check committed site output is current
        run: test -z "$(git status --porcelain -- docs/)"
